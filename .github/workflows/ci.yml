name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    name: Perl ${{ matrix.perl }} on ubuntu-latest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        perl:
          - '5.40.4'
          - '5.38.5'
          - '5.36.3'
          - '5.34.3'
          - '5.32.1'
          - '5.30.3'
          - '5.28.3'
          - '5.26.3'
          - '5.24.4'
          - '5.22.4'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Set up Perl ${{ matrix.perl }}
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
          install-modules-with: cpanm

      - name: Show Perl configuration
        run: perl -V

      - name: Cache CPAN modules
        uses: actions/cache@v4
        with:
          path: ~/perl5
          key: ${{ runner.os }}-perl-${{ matrix.perl }}-${{ hashFiles('Makefile.PL') }}
          restore-keys: |
            ${{ runner.os }}-perl-${{ matrix.perl }}-

      - name: Bootstrap configure-time dependencies
        run: cpanm --notest "ExtUtils::MakeMaker~>=7.12" Object::Pad::ExtensionBuilder XS::Parse::Keyword::Builder

      - name: Install declared dependencies
        run: cpanm --installdeps --notest --verbose .

      - name: Configure
        run: perl Makefile.PL

      - name: Build
        run: make

      - name: Test
        env:
          HARNESS_OPTIONS: j4
        run: make test

      - name: Verbose test re-run on failure
        if: failure()
        run: prove -lvb t
